[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gieni-core-platform"
version = "2.0.0"
description = "Gieni Acquisition Decision Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.3",
    "shapely>=2.0.2",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.2.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
