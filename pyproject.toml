[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gieni-os"
version = "2.0.0"
description = "Gieni OS - Production Operating System for Municipal Probate Intelligence"
authors = [{ name = "Gieni Platform Team" }]
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    # Data validation & serialization
    "pydantic>=2.0.0",
    # Database ORM & migrations
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    # Config & environment
    "python-dotenv>=1.0.0",
    # Security & auth
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Auth (Clerk)
    "clerk-backend-api>=1.0.0",
    # HTTP clients
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    # Browser automation (county scraping)
    "playwright>=1.40.0",
    # LLM clients
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    # Scientific / ML / embeddings
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "tiktoken>=0.5.0",
    # Graph database
    "neo4j>=5.0.0",
    # Cache / pub-sub
    "redis>=5.0.0",
    # Cloud / OCR
    "boto3>=1.28.0",
    "pytesseract>=0.3.10",
    # SMS / communications
    "twilio>=8.0.0",
    # Browser automation (county scraping)
    "playwright>=1.40.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live database (deselect with '-m not integration')",
]

[tool.coverage.run]
source = ["src/gieni_os"]
omit = ["tests/*", "scripts/*"]
