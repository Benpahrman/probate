<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gieni OS Acquisition Decision Intelligence Platform - Deterministic 14-Stage Lifecycle Engine, Quality Control Gatekeeper, and Municipal Intake">
    <title>Gieni OS | Acquisition Decision Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Main Sidebar -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between" id="sidebar-container">
            <div>
                <div class="p-6 border-b border-slate-800">
                    <h1 class="text-xl font-black tracking-widest text-indigo-400">GIENI OS</h1>
                    <p class="text-xs text-slate-500 tracking-wider mt-1 font-mono">DECISION INTELLIGENCE v2.0</p>
                </div>
                <nav class="p-4 space-y-1.5" id="main-navigation">
                    <button onclick="switchTab('pipeline')" id="tab-pipeline" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 nav-btn">
                        <span class="mr-2">📊</span> 1. Pipeline Workbench
                    </button>
                    <button onclick="switchTab('county')" id="tab-county" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white nav-btn">
                        <span class="mr-2">🏛️</span> 2. County Ingestion
                    </button>
                    <button onclick="switchTab('exceptions')" id="tab-exceptions" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white nav-btn">
                        <span class="mr-2">⚠️</span> 3. Tasks & Exceptions
                    </button>
                    <button onclick="switchTab('investigator')" id="tab-investigator" class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white nav-btn">
                        <span class="mr-2">🔍</span> 4. Property Investigator
                    </button>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                <div class="flex items-center space-x-2.5">
                    <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 pulse-indicator"></span>
                    <span class="font-medium text-slate-400" id="api-status-badge">API v1 Connected</span>
                </div>
                <div class="text-[11px] text-slate-600 mt-1 font-mono">Port: 8000 | Engine: Ready</div>
            </div>
        </aside>

        <!-- Dynamic Main Workspace -->
        <main class="flex-1 flex flex-col overflow-y-auto" id="main-workspace">
            <header class="h-16 border-b border-slate-800 px-8 flex items-center justify-between bg-slate-900/50 backdrop-blur sticky top-0 z-10">
                <h2 id="workspace-title" class="text-lg font-bold tracking-tight text-white">14-Stage Opportunity Pipeline</h2>
                <div class="flex items-center space-x-4">
                    <button onclick="refreshCurrentTab()" id="btn-refresh" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-xs font-semibold rounded-md border border-slate-700 flex items-center space-x-1.5">
                        <span>🔄</span>
                        <span>Refresh Live State</span>
                    </button>
                </div>
            </header>

            <div class="p-8 flex-1" id="view-container">
                <!-- Injected via app.js -->
            </div>
        </main>
    </div>

    <!-- Modal Review Window -->
    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-2xl w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-indigo-300">File Review</h3>
                <button onclick="closeModal()" id="btn-close-modal" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <div id="modal-body" class="text-sm space-y-3"></div>
            <div id="modal-actions" class="flex justify-end space-x-3 pt-4 border-t border-slate-800"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
