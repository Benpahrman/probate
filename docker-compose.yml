version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gieni-postgres
    environment:
      POSTGRES_USER: gieni_user
      POSTGRES_PASSWORD: gieni_password
      POSTGRES_DB: gieni_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gieni_user -d gieni_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gieni-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
